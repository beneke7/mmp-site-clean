<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fokozás applet editor</title>
  <script>try{const t=localStorage.getItem("mmp-theme");if(t)document.documentElement.dataset.theme=t}catch{}</script>
  <link rel="stylesheet" href="../site/static/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="workbench author-layout">
    <section class="stage" aria-label="Animated construction">
      <div class="canvas-wrap">
        <svg id="canvas" viewBox="-3.4 -2.6 6.8 5.2" role="img" aria-label="Animated geometric construction"></svg>
      </div>
      <div class="stage-controls">
        <label class="range-label">Animation
          <input id="slider" type="range" min="-1" max="1" step="0.002" value="0.72" aria-label="Move animated point">
        </label>
        <label class="range-label construction-control">Construction <output id="stepValue">all</output>
          <input id="stepSlider" type="range" min="0" max="13" step="1" value="13" aria-label="Show construction steps">
        </label>
        <div class="history-controls" aria-label="History">
          <button id="undo" class="history-button" type="button" aria-label="Undo" title="Undo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6H4l3-3M4 6h9a6 6 0 0 1 6 6v3"></path></svg></button>
          <button id="redo" class="history-button" type="button" aria-label="Redo" title="Redo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6h5l-3-3M20 6h-9a6 6 0 0 0-6 6v3"></path></svg></button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <section id="authorPanel">
        <div class="panel-title">
          <div><h2>Construct the problem</h2></div>
          <div class="panel-actions"><a class="back-link" href="../out/">Main menu</a><button class="quiet" id="reset" type="button">Reset</button></div>
        </div>

        <section class="editor-section">
          <div class="section-head"><h3>Construction</h3></div>
          <div id="toolPalette" class="tool-palette"></div>
          <div id="toolHelp" class="tool-help"></div>
          <div id="steps" class="step-list"></div>
        </section>

        <section class="editor-section">
          <div class="section-head"><h3>Claim</h3></div>
          <form id="claimForm" class="claim-form">
            <select id="claimOp" aria-label="Claim type"><option value="collinear">collinear</option><option value="concurrent">concurrent</option></select>
            <span id="claimArgs"></span>
            <button type="submit">Update claim</button>
          </form>
          <div class="claim-result" id="claimResult"></div>
        </section>

        <section class="editor-section">
          <div class="section-head"><h3>Degrees</h3></div>
          <div id="answers" class="answer-table"></div>
        </section>

        <section class="editor-section export-section">
          <div class="section-head"><h3>Export</h3></div>
          <div class="export-actions"><button id="downloadMmp" type="button">Download .mmp</button><button id="downloadJSON" type="button" class="secondary">Export JSON</button><label class="file-button">Import JSON<input id="importJSON" type="file" accept="application/json,.json"></label></div>
        </section>
      </section>

    </aside>
    <button id="resizeSidebar" class="sidebar-resize" type="button" aria-label="Resize tools"></button>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
